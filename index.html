<!DOCTYPE html>
<html lang="hu" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe6d6">
<title>1 év · Jázmin &amp; Miki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loader" aria-live="polite">
  <div class="loader-inner">
    <div class="loader-heart hand">♡</div>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <p class="loader-text hand">betöltés...</p>
  </div>
</div>

<div class="grain" aria-hidden="true"></div>
<button id="mute" type="button" aria-label="Hang be/ki" aria-pressed="false">🔊</button>
<div id="spine" aria-hidden="true"><i></i></div>

<section id="cover" tabindex="0" aria-label="Napló kinyitása">
  <div class="book">
    <div class="book-page hand">egy év képekben</div>
    <div class="book-cover" id="book-cover">
      <div class="cover-stitch"></div>
      <div class="cover-label">
        <small>A MI NAPLÓNK</small>
        <h1 class="hand">1 év</h1>
        <p class="hand">Jázmin &amp; Miki</p>
      </div>
    </div>
  </div>
  <p class="cover-hint hand">koppints a naplóra, vagy húzd felfelé</p>
</section>

<main id="story">
  <section id="counter" class="scene">
    <p class="counter-pre hand">Ma pontosan</p>
    <div class="counter-num hand" id="counter-days">0</div>
    <p class="counter-post hand">napja vagyunk együtt</p>
    <p class="scroll-cue hand">görgess lefelé ↓</p>
  </section>

  <div id="chapters"></div>

  <section id="finale">
    <header class="ch-head" id="letter-head">
      <span class="ch-num">utolsó lap</span>
      <h2 class="ch-title hand">Neked</h2>
    </header>
    <div class="letter" id="letter"></div>

    <section id="shake" class="scene">
      <span class="ch-num">még egy utolsó dolog</span>
      <div class="shake-heart" id="shake-heart">
        <svg viewBox="-4 -4 108 98" aria-hidden="true">
          <defs>
            <clipPath id="heart-clip">
              <path d="M50 88 C 18 66, 2 46, 2 27 C 2 12, 13 2, 27 2 C 38 2, 46 9, 50 18 C 54 9, 62 2, 73 2 C 87 2, 98 12, 98 27 C 98 46, 82 66, 50 88 Z"/>
            </clipPath>
          </defs>
          <rect id="shake-fill" x="0" y="90" width="100" height="0" clip-path="url(#heart-clip)"/>
          <path class="heart-line" d="M50 88 C 18 66, 2 46, 2 27 C 2 12, 13 2, 27 2 C 38 2, 46 9, 50 18 C 54 9, 62 2, 73 2 C 87 2, 98 12, 98 27 C 98 46, 82 66, 50 88 Z"/>
        </svg>
      </div>
      <p class="shake-count hand" id="shake-count" aria-live="polite" hidden></p>
      <p class="shake-text hand" id="shake-text" aria-live="polite"></p>
      <button class="shake-btn hand" id="shake-start" type="button">kezdjük</button>
    </section>
  </section>
</main>

<div id="love" hidden>
  <div class="love-stage"></div>
  <div class="love-words hand">Nagyon<br>szeretlek!</div>
  <div class="love-foot">
    <p class="hand">folytatás következik...</p>
    <small>2025. 09. 14. óta</small>
  </div>
</div>

<div id="fx-layer" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
