<!DOCTYPE html>
<html lang="hu" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe6d6">
<title>1 év · Jázmin &amp; Miki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loader" aria-live="polite">
  <div class="loader-inner">
    <div class="loader-heart hand">♡</div>
    <div class="loader-bar"><i id="loader-fill"></i></div>
    <p class="loader-text hand">előkeressük a naplót...</p>
  </div>
</div>

<div class="grain" aria-hidden="true"></div>
<button id="mute" type="button" aria-label="Hang be/ki" aria-pressed="false">🔊</button>
<div id="spine" aria-hidden="true"><i></i></div>

<section id="cover" tabindex="0" aria-label="Napló kinyitása">
  <div class="book">
    <div class="book-page hand">ez a mi történetünk ♡</div>
    <div class="book-cover" id="book-cover">
      <div class="cover-stitch"></div>
      <div class="cover-label">
        <small>A MI NAPLÓNK</small>
        <h1 class="hand">1 év</h1>
        <p class="hand">Jázmin &amp; Miki</p>
      </div>
    </div>
  </div>
  <p class="cover-hint hand">koppints a naplóra, vagy húzd felfelé</p>
</section>

<main id="story">
  <section id="counter" class="scene">
    <p class="counter-pre hand">Ma pontosan</p>
    <div class="counter-num hand" id="counter-days">0</div>
    <p class="counter-post hand">napja vagyunk együtt</p>
    <p class="counter-clock" id="counter-clock">00 óra · 00 perc · 00 mp</p>
    <p class="scroll-cue hand">görgess, lapozzunk bele ↓</p>
  </section>

  <div id="chapters"></div>

  <section id="finale">
    <header class="ch-head">
      <span class="ch-num">utolsó lap</span>
      <h2 class="ch-title hand">Neked</h2>
    </header>
    <div class="letter" id="letter"></div>

    <div class="candle-wrap">
      <p class="candle-title hand">Fújd el a gyertyát</p>
      <div class="candle" id="candle" role="button" aria-label="Gyertya elfújása">
        <div class="glow"></div>
        <div class="flame-wrap"><div class="flame" id="flame"></div></div>
        <div class="wick"></div>
        <div class="wax"></div>
      </div>
      <button class="btn-hand hand" id="candle-start" type="button">kész vagyok, fújom!</button>
      <p class="candle-help hand" id="candle-help" aria-live="polite"></p>
    </div>

    <div class="the-end" id="the-end">
      <p class="hand">folytatás következik...</p>
      <small>2025. 09. 14. óta ♡</small>
    </div>
  </section>
</main>

<div id="fx-layer" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
